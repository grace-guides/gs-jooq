plugins {
    id "eclipse"
    id "idea"
    id "org.graceframework.grace-app"
    id "org.graceframework.asset-pipeline"
    id "org.graceframework.grace-gsp"
    id "org.jooq.jooq-codegen-gradle"
}

group = "app"

repositories {
    mavenCentral()
}

configurations {
    developmentOnly
}

dependencies {
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    // console "org.graceframework:grace-console"
    implementation "org.graceframework:grace-boot-async"
    implementation "org.graceframework:grace-boot-cache"
    implementation "org.graceframework:grace-boot-events"
    implementation "org.graceframework:grace-boot-logging"
    implementation "org.graceframework:grace-boot-persistence"
    implementation "org.graceframework:grace-boot-plugin"
    implementation "org.graceframework:grace-boot-validation"
    implementation "org.graceframework:grace-boot-web"
    implementation "org.graceframework:grace-plugin-datasource"
    implementation "org.graceframework:grace-plugin-fields"
    implementation "org.graceframework:grace-plugin-gsp"
    implementation "org.graceframework:grace-plugin-scaffolding"
    implementation "org.graceframework:grace-plugin-services"
    implementation "org.graceframework:grace-plugin-taglibs"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.springframework.boot:spring-boot-starter-jooq"
    jooqCodegen "com.h2database:h2:2.4.240"
    profile "org.graceframework.profiles:web"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "org.graceframework.plugins:asset-pipeline-plugin"
    testImplementation "org.graceframework:grace-boot-test"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

tasks.withType(JavaCompile) {
    dependsOn 'jooqCodegen'
}

tasks.withType(Test) {
    useJUnitPlatform()
}

jooq {
    configuration {
        jdbc {
            url = 'jdbc:h2:file:./build/gs_jooq_dev'
            username = 'sa'
            password = ''
            initScript = 'src/main/resources/db/migration/V1__INIT.sql'
        }
        generator {
            database {
                inputSchema = 'PUBLIC'
            }
            target {
                packageName = 'grace.guides.db'
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs += ['build/generated-sources/jooq']
        }
    }
}